name: les variables et contextes
on:
  push:
    branches:
      - main
      - develop
env:
  MA_VARIABLE: variable dans le workflow
  AUTRE_VARIABLE: autre valeur globale

jobs:
  variable-et-contexte:
    env:
      JOB_VARIABLE: valeur spécifique au job
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
      - name: Lister les variables par défaut
        run: env
      - name: Lister les variables d'environnement du job
        env:
          STEP_VARIABLE: valeur spécifique à l'étape
        run: |
            echo "---------Variables GITHUB---------"
            echo $GITHUB_REF
            echo $GITHUB_SHA
            echo "---------Variables d'environnement---------"
            echo $MA_VARIABLE
            echo $AUTRE_VARIABLE
            echo "---------Affichage des variables en utilisant le contexte---------"
            echo ${{github.ref}}
            echo ${{env.MA_VARIABLE}}
            echo ${{runner.os}}